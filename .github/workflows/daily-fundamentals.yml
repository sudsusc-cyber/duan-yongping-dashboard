name: Daily Fundamentals Refresh

# Refresh PE (forward/trailing) + 5Y price snapshot from Yahoo Finance.
# Runs daily after US close (~22:00 UTC = 06:00 Beijing next day).
# No SEC secret needed — Yahoo's chart API is unauth + UA-only.
# Auto-detects the latest quarter in data/13f-history/.

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Fetch PE + 5Y price snapshot
        run: npx tsx scripts/fetch-fundamentals.ts

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals/
          if git diff --cached --quiet; then
            echo "No fundamentals delta — skipping commit."
          else
            git commit -m "chore(data): daily PE + 5Y snapshot refresh"
            git push
          fi
